# task and should be included in the git repository. Please do not edit it manually.

name: Deploy Preview
env: {}
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
permissions:
  statuses: write
  contents: read
  pull-requests: write
  actions: read
  deployments: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest
    continue-on-error: false
    if: ${{ (github.event.workflow_run.event == 'pull_request') && (github.event.workflow_run.conclusion == 'success') }}
    steps:
    - name: Download Website Artifact
      id: download-website
      uses: actions/download-artifact@v8
      with:
        name: website-artifact
        path: website-artifact
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    - name: Download PR Metadata
      id: download-pr-metadata
      uses: actions/download-artifact@v8
      with:
        name: pr-metadata
        path: pr-metadata
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    - name: Read PR Number
      id: pr
      if: ${{ (steps.download-website.outcome == 'success') && (steps.download-pr-metadata.outcome == 'success') }}
      run: echo "number=$(cat pr-metadata/pr-number.txt)" >> "$GITHUB_OUTPUT"
    - name: Compute Deployment Metadata
      id: meta
      if: ${{ (steps.download-website.outcome == 'success') && (steps.download-pr-metadata.outcome == 'success') }}
      run: |
        echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
        sha="${{ github.event.workflow_run.head_sha }}"
        echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
    - name: Deploy Preview to Netlify
      id: netlify-deploy
      uses: nwtgck/actions-netlify@v4.0
      if: ${{ (steps.download-website.outcome == 'success') && (steps.download-pr-metadata.outcome == 'success') }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        alias: pr-${{ steps.pr.outputs.number }}
        publish-dir: ./website-artifact
        enable-pull-request-comment: false
        enable-commit-comment: false
        deploy-message: 'PR #${{ steps.pr.outputs.number }}'
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    - name: Post Preview URL Comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: ${{ (steps.download-website.outcome == 'success') && (steps.download-pr-metadata.outcome == 'success') }}
      with:
        number: ${{ steps.pr.outputs.number }}
        header: netlify-preview
        message: |-
          🚀 Preview deployed to Netlify: ${{ steps.netlify-deploy.outputs.deploy-url }}

          🕒 Deployed at: ${{ steps.meta.outputs.time }}
          📌 Commit: [`${{ steps.meta.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})
