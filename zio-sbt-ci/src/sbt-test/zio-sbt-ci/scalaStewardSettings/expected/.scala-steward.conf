updates.pin = [
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
updates.allow = [
  { groupId = "org.typelevel" }
]
updates.ignore = [
  { groupId = "org.scala-native", artifactId = "sbt-scala-native", version = "0.5.7" }
]
updates.limit = 5
updatePullRequests = "always"
commits.message = "Update ${artifactName}, say \"hello\""
pullRequests.frequency = "@asap"
pullRequests.grouping = [
  { name = "patches", filter = [{ "version" = "patch" }] },
  { name = "typelevel", filter = [{ "group" = "org.typelevel" }] }
]
assignees = ["octocat"]
reviewers = ["octocat"]
