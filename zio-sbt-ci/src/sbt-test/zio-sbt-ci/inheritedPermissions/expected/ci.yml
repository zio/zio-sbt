# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env: {}
'on':
  pull_request:
    branches-ignore:
    - gh-pages
  push:
    branches:
    - master
jobs:
  tag:
    name: Tag build
    runs-on: ubuntu-latest
    continue-on-error: false
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Tag release
      if: ${{ github.ref == 'refs/heads/master' }}
      run: sbt ciReleaseTagNextVersion
  integration-test:
    name: Integration test
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-latest
        scala:
        - 2.13.x
        - 3.x
    needs:
    - tag
    services:
      floci:
        image: floci/floci:latest
        env:
          AWS_DEFAULT_REGION: us-east-1
        ports:
        - 4566:4566
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Build and run tests
      run: sbt ++${{ matrix.scala }} integtests/test
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
  release:
    name: Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - integration-test
    if: ${{ (github.ref == 'refs/heads/master') && (github.actor != 'github-actions[bot]') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Publish
      run: sbt sonaRelease
