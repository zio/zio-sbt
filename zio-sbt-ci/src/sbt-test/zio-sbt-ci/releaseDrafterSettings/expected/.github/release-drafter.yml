name-template: v$NEXT_PATCH_VERSION
tag-template: v$NEXT_PATCH_VERSION
categories:
- title: Features
  labels:
  - feature
  - enhancement
- title: Fixes
  labels:
  - bug
exclude-labels:
- skip-changelog
- internal
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
autolabeler:
- label: documentation
  files:
  - '*.md'
  - docs/**
- label: feature
  branch:
  - feature/.+
version-resolver:
  major:
    labels:
    - breaking
  minor:
    labels:
    - feature
  patch:
    labels:
    - fix
  default: patch
template: |
  ## Changes
  $CHANGES
