version: 2
updates:
  # .github/workflows/ci.yml, auto-approve.yml and auto-merge.yml are
  # generated by zio-sbt-ci from V.scala. renovate.json disables its
  # github-actions manager for exactly these three files, because editing
  # them directly desynchronises them from V.scala and fails
  # `sbt ciCheckGithubWorkflow` (see #694). Dependabot has no equivalent
  # file-level exclusion for the github-actions ecosystem: `directory` always
  # scans the whole .github/workflows tree, and `ignore` only filters by
  # dependency-name/version, not by path. So Dependabot PRs can still land
  # here and reintroduce the same desync - if one appears for ci.yml,
  # auto-approve.yml or auto-merge.yml, close it and instead bump the pin in
  # zio-sbt-ci/src/main/scala/zio/sbt/V.scala, then regenerate the workflow
  # with `sbt ciGenerateGithubWorkflow`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Docusaurus site under website/ is built with npm by WebsitePlugin
  # (`npm install` / `npm run build`). Without this entry only Dependabot
  # *security* updates reach it, which is how the site drifted onto Docusaurus
  # 3.x while its peers stayed on 2.x and `npm install` started failing with
  # ERESOLVE. Docusaurus and its peer packages are grouped so they always move
  # together in a single PR instead of one at a time.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "react"
          - "react-dom"
          - "prism-react-renderer"
          - "clsx"
      website-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
