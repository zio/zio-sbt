version: 2
updates:
  # GitHub Actions versions are pinned in zio-sbt-ci's `V.scala` and baked into
  # `.github/workflows/*.yml` by `sbt ciGenerateGithubWorkflow`. Dependabot can only
  # edit the generated yml files, so on its own its PRs fail Lint (see #773). The
  # dependabot-regenerate-workflows.yml workflow fixes each PR up: it copies the
  # bumped pins back into `V.scala`, regenerates, and pushes to the PR branch.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Docusaurus site under website/ is built with npm by WebsitePlugin
  # (`npm install` / `npm run build`). Without this entry only Dependabot
  # *security* updates reach it, which is how the site drifted onto Docusaurus
  # 3.x while its peers stayed on 2.x and `npm install` started failing with
  # ERESOLVE. Docusaurus and its peer packages are grouped so they always move
  # together in a single PR instead of one at a time.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "react"
          - "react-dom"
          - "prism-react-renderer"
          - "clsx"
      website-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
