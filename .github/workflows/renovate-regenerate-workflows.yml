# Hand-written (not generated by `sbt ciGenerateGithubWorkflow`) — like scala-steward.yml,
# dependency-graph.yml and release-drafter.yml, this one is safe for bots/humans to edit directly.
#
# Why this exists: `zio-sbt-ci/src/main/scala/zio/sbt/V.scala` is the source of truth for the
# GitHub Actions versions baked into ci.yml / auto-approve.yml / auto-merge.yml / deploy-preview.yml
# by `sbt ciGenerateGithubWorkflow`. Renovate's custom regex manager (see renovate.json) already
# bumps the pins in V.scala directly and opens a PR for it - but it has no way to also run
# `sbt ciGenerateGithubWorkflow`, so the generated yml files are left stale and the PR fails
# `sbt ciCheckGithubWorkflow` in the Lint job (this is what made #694/#724 and dependabot PR #773
# unworkable). This workflow closes that gap: it watches for Renovate's V.scala PRs, regenerates
# the workflow files, and pushes the fix onto the same PR branch so Lint goes green without a
# manual follow-up commit.
#
# Note: postUpgradeTasks (Renovate's built-in "run a command after the update" feature) can't do
# this for us, because the `allowedCommands` allowlist that gates it is a self-hosted-only,
# bot-operator-level setting - the Mend-hosted GitHub App we use does not expose it to repos. Fully
# self-hosting Renovate just to unlock that one feature (extra credentials, its own runtime, losing
# the hosted app's maintenance) is a lot of machinery for what a five-step job below already does.
name: Regenerate CI workflows for Renovate

on:
  pull_request:
    paths:
      - "zio-sbt-ci/src/main/scala/zio/sbt/V.scala"

permissions:
  contents: read

concurrency:
  group: regenerate-ci-workflows-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: regenerate-generated-workflows
    runs-on: ubuntu-latest
    # Only Renovate opens/updates PRs that touch V.scala today. Extend this list if another bot
    # (e.g. a future scala-steward rule) ever starts editing it too.
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Check App Token
        id: check-app-token
        run: |
          if [ -n "$APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}

      # Same app-token dance as auto-merge.yml, and for the same reason: a commit pushed with the
      # default GITHUB_TOKEN would not trigger a new `pull_request synchronize` run of ci.yml
      # (GitHub suppresses workflow runs triggered by GITHUB_TOKEN, to prevent recursive loops).
      # Lint would then never re-run against the fix, and the PR would sit with a stale/pending
      # check forever. A GitHub App installation token doesn't have that restriction.
      - name: Generate Token
        id: generate-token
        uses: zio/generate-github-app-token@v1.0.0
        if: ${{ steps.check-app-token.outputs.configured == 'true' }}
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Git Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Setup Scala
        uses: actions/setup-java@v5.7.0
        with:
          distribution: corretto
          java-version: "17"
          check-latest: true

      - name: Setup SBT
        uses: sbt/setup-sbt@v1.5.7

      - name: Cache Dependencies
        uses: coursier/cache-action@v8.1.1

      - name: Regenerate GitHub workflow files from V.scala
        run: sbt --no-colors ciGenerateGithubWorkflow

      - name: Commit and push regenerated workflows if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo "Generated workflows already match V.scala; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "chore(ci): regenerate GitHub workflows from V.scala"
          git push origin "HEAD:${{ github.head_ref }}"
