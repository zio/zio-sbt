# Hand-written (not generated by `sbt ciGenerateGithubWorkflow`) — like renovate-regenerate-workflows.yml,
# scala-steward.yml and release-drafter.yml, this one is safe for bots/humans to edit directly.
#
# Why this exists: Dependabot's github-actions ecosystem can only edit the generated
# `.github/workflows/*.yml` files. The source of truth for those pins is
# `zio-sbt-githubactions/src/main/scala/zio/sbt/V.scala`, so a raw Dependabot PR fails `ciCheckGithubWorkflow`
# in the Lint job (this is what made PR #773 unworkable). This is the mirror image of
# renovate-regenerate-workflows.yml (which goes V.scala -> yml): here we go yml -> V.scala first,
# then regenerate, so the PR ends up with V.scala and the generated files in sync.
#
# Things to know when operating this:
# - Secrets: workflows triggered by dependabot[bot] read the *Dependabot* secrets store, not the
#   repo's Actions secrets. Add APP_ID and APP_PRIVATE_KEY under Settings -> Secrets and variables
#   -> Dependabot. Without them "Generate Token" is skipped and the push falls back to
#   GITHUB_TOKEN, so CI on the sync commit may sit at `action_required` until someone approves it.
# - Rebasing: once this workflow has pushed its sync commit, the branch has a commit that is not
#   Dependabot's, so `@dependabot rebase` is refused ("edited by someone other than Dependabot").
#   Use `@dependabot recreate` instead; the workflow simply runs again on the fresh branch.
# - Scope: the sync commit covers every path this job can change (see SYNCED_PATHS below): the
#   generated workflows, V.scala and the zio-sbt-ci/src/sbt-test fixtures that hardcode the pins.
name: Regenerate CI workflows for Dependabot

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: dependabot-regenerate-ci-workflows-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: sync-v-scala-and-regenerate-workflows
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Check App Token
        id: check-app-token
        run: |
          if [ -n "$APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}

      # A push made with the default GITHUB_TOKEN would not retrigger ci.yml, leaving Lint
      # pending forever (see renovate-regenerate-workflows.yml). Use the GitHub App token.
      - name: Generate Token
        id: generate-token
        uses: zio/generate-github-app-token@v1.0.0
        if: ${{ steps.check-app-token.outputs.configured == 'true' }}
        with:
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Git Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - name: Setup Scala
        uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: "17"
          check-latest: true

      - name: Setup SBT
        uses: sbt/setup-sbt@v1.5.7

      - name: Cache Dependencies
        uses: coursier/cache-action@v8.1.1

      - name: Sync V.scala from Dependabot's bumped workflow files
        run: .github/scripts/sync-v-scala-from-workflows.sh

      - name: Regenerate GitHub workflow files from V.scala
        run: sbt --no-colors ciGenerateGithubWorkflow

      - name: Commit and push V.scala, fixtures and regenerated workflows if changed
        run: |
          set -euo pipefail
          # Everything the sync script + generator can touch: the generated workflows, the V.scala
          # pins, and the scripted-test fixtures that hardcode those pins. Leaving one out means
          # its edits are silently dropped and the corresponding scripted tests fail.
          SYNCED_PATHS=(.github/workflows zio-sbt-githubactions/src/main/scala/zio/sbt/V.scala zio-sbt-ci/src/sbt-test)
          if git diff --quiet -- "${SYNCED_PATHS[@]}"; then
            echo "V.scala and generated workflows already in sync; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SYNCED_PATHS[@]}"
          git commit -m "chore(ci): sync V.scala and regenerate GitHub workflows"
          git push origin "HEAD:${{ github.head_ref }}"
